server:
  port: 8081

spring:
  application:
    name: codex
  datasource:
    url: jdbc:postgresql://localhost:5432/codex
    username: codex
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.xml